version: '3.8'

services:
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5200:5200"
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/furniture_db
      - SERVER_HOST=0.0.0.0
    depends_on:
      - postgres

  postgres:
    image: postgres:16.2-alpine3.19
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=furniture_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
